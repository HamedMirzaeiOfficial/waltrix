[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waltrix-api"
version = "0.1.0"
description = "Waltrix REST API (FastAPI) on top of waltrix-core."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "waltrix-core==0.1.0",
  "fastapi>=0.115,<0.122",
  "uvicorn[standard]>=0.32,<0.39",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
waltrix = "waltrix_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
