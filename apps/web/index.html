<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Waltrix - financial infrastructure, built for correctness." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Waltrix</title>
    <script>
      try {
        const t = localStorage.getItem("waltrix-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
      // Language before the first render: saved choice, else the browser language. Sets dir too, so a
      // Persian user never sees a left-to-right flash. src/lib/i18n.ts reads <html lang> on startup.
      try {
        let lang = localStorage.getItem("waltrix-lang");
        if (lang !== "fa" && lang !== "en") lang = /^fa\b/i.test(navigator.language || "") ? "fa" : "en";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
