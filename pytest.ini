[pytest]
testpaths = tests apps/api/tests packages/python-sdk/tests
addopts = -ra --strict-markers
markers =
    stress: heavier concurrency tests (still run by default)
filterwarnings =
    error::sqlalchemy.exc.SAWarning
    ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning
    ignore:You should not use the .timeout. argument with the TestClient:DeprecationWarning
