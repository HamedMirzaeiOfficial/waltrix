[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waltrix-core"
version = "0.1.0"
description = "Waltrix double-entry ledger and wallet engine (framework-independent)."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waltrix_core = ["py.typed", "migrations/*.ini", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
