[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "waltrix"
version = "0.1.0"
description = "Typed Python client for the Waltrix ledger and wallet API (sync and async)."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waltrix = ["py.typed"]
